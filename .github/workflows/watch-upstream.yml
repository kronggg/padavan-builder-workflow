name: Watch upstream changes

on:
  schedule:
    - cron: '5 5 * * *'  # 08:05 MSK ежедневно
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { shell: bash } }
    steps:
    - uses: actions/checkout@v4
      with:
        ref: beta
        fetch-depth: 0

    - name: Check upstream for new commits
      run: |
        . variables

        LAST_BUILT=$(cat .upstream/last-built 2>/dev/null || echo "")
        CHECKED_SHA=$(cat .upstream/checked 2>/dev/null || echo "")

        if [[ -z "$CHECKED_SHA" && -z "$LAST_BUILT" ]]; then
          echo "No baseline SHA found, initializing"
          echo "$PADAVAN_COMMIT" > .upstream/checked
          git add .upstream/checked
          if ! git diff --cached --quiet; then
            git -c user.name='padavan-builder' -c user.email='<>' commit -m "upstream: init checked SHA"
            git push
          else
            echo "No changes to commit."
          fi
          exit 0
        fi

        git remote add upstream "$PADAVAN_REPO" 2>/dev/null || true
        git fetch upstream "$PADAVAN_BRANCH" --depth=300

        # BASE — точка, до которой upstream уже обработан.
        # Приоритет у last-built (реально собранное). checked — верхняя граница осмотренного.
        # Если checked отстал от last-built, baseline берём по last-built, чтобы не
        # пере-находить уже собранные коммиты (фантомные pending).
        BASE="$CHECKED_SHA"
        if [[ -n "$LAST_BUILT" ]]; then
          if [[ -z "$CHECKED_SHA" ]]; then
            BASE="$LAST_BUILT"
          elif ! git merge-base --is-ancestor "$CHECKED_SHA" "$LAST_BUILT" 2>/dev/null; then
            BASE="$LAST_BUILT"
          fi
        fi

        NEW_COMMITS=$(git log --format="%H" "$BASE".."upstream/$PADAVAN_BRANCH" 2>/dev/null | tac)
        COMMIT_COUNT=$(echo "$NEW_COMMITS" | grep -c . || true)

        LATEST_SHA=$(git rev-parse "upstream/$PADAVAN_BRANCH")

        if [[ "$COMMIT_COUNT" -eq 0 ]]; then
          echo "No new commits since last check"
          echo "$LATEST_SHA" > .upstream/checked
          git add .upstream/checked
          if ! git diff --cached --quiet; then
            git -c user.name='padavan-builder' -c user.email='<>' commit -m "upstream: check $(date +%Y-%m-%d) (no new)"
            git push
          else
            echo "No changes to commit."
          fi
          exit 0
        fi

        echo "Found $COMMIT_COUNT new commit(s)"

        URGENCY=false
        touch .upstream/pending

        for SHA in $NEW_COMMITS; do
          CHANGED_FILES=$(git diff --name-only "$SHA"^.."$SHA" 2>/dev/null || echo "")

          COMMIT_MSG=$(git log --format="%s %b" -1 "$SHA" | tr '[:upper:]' '[:lower:]')
          if echo "$COMMIT_MSG" | grep -qE '(cve|cvss|security|fix critical)'; then
            URGENCY=true
            echo "URGENCY: $SHA - $(echo "$COMMIT_MSG" | head -c 80)"
          fi

          MEANINGFUL=false
          for FILE in $CHANGED_FILES; do
            case "$FILE" in
              trunk/libs/*|trunk/user/*|trunk/linux-3.4.x/*|trunk/configs/boards/*|trunk/build_firmware.sh|trunk/clear_tree.sh|toolchain/*)
                MEANINGFUL=true
                break
                ;;
            esac
          done

          if [[ "$MEANINGFUL" == true ]]; then
            if ! grep -qx "$SHA" .upstream/pending 2>/dev/null; then
              echo "$SHA" >> .upstream/pending
              echo "Added to pending: $SHA"
            fi
          fi
        done

        echo "$LATEST_SHA" > .upstream/checked

        git add .upstream/checked
        if [[ -f .upstream/pending ]]; then
          git add .upstream/pending
        fi
        PENDING_COUNT=$(wc -l < .upstream/pending 2>/dev/null || echo 0)
        if ! git diff --cached --quiet; then
          git -c user.name='padavan-builder' -c user.email='<>' commit -m "upstream: check $(date +%Y-%m-%d)

        Commits checked: ${BASE:0:8}..${LATEST_SHA:0:8} ($COMMIT_COUNT new)
        Pending: ${PENDING_COUNT} SHA(s)"
          git push
        else
          echo "No changes to commit."
        fi

        echo "URGENCY=$URGENCY" >> $GITHUB_ENV

    - name: Trigger weekly or urgent build
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        . variables

        if [[ -f .upstream/pending ]]; then
          PENDING_COUNT=$(wc -l < .upstream/pending)
        else
          PENDING_COUNT=0
        fi

        if [[ "$PENDING_COUNT" -eq 0 ]]; then
          echo "No pending commits, no build needed"
          exit 0
        fi

        URGENCY="${{ env.URGENCY }}"

        if [[ "$URGENCY" != "true" && "$(date +%u)" -ne 1 ]]; then
          echo "Not Monday (day $(date +%u)), skipping weekly build. $PENDING_COUNT SHA(s) pending."
          exit 0
        fi

        # Диспатч сборки прямо на beta — без тегов и без зависимости от default branch.
        if gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref beta; then
          echo "Dispatched build.yml on beta"
        else
          echo "WARN: dispatch failed, keeping pending for next run"
          exit 0
        fi

        > .upstream/pending
        git add .upstream/pending
        if ! git diff --cached --quiet; then
          git -c user.name='padavan-builder' -c user.email='<>' commit -m "upstream: clear pending after dispatch $(date +%F)"
          git push
        else
          echo "No changes to commit."
        fi
