name: Build firmware

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - rm-ac2100
          - mi-3
          - mi-r3gv2
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  rm-ac2100:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.model == 'all' || github.event.inputs.model == 'rm-ac2100' }}
    uses: ./.github/workflows/build-one.yml
    with:
      model: rm-ac2100

  mi-3:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.model == 'all' || github.event.inputs.model == 'mi-3' }}
    uses: ./.github/workflows/build-one.yml
    with:
      model: mi-3

  mi-r3gv2:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.model == 'all' || github.event.inputs.model == 'mi-r3gv2' }}
    uses: ./.github/workflows/build-one.yml
    with:
      model: mi-r3gv2

  finalize:
    if: ${{ (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.model == 'all') }}
    needs: [rm-ac2100, mi-3, mi-r3gv2]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        ref: beta
        # Полная история: ниже делаем rebase-ретрай, а shallow-клон его не переживёт.
        fetch-depth: 0

    - name: Compute release tag
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          TAG="${{ github.ref_name }}"
        else
          TAG="v$(date -u +%Y.%m.%d)"
        fi
        echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
        echo "Release tag: $TAG"

    - name: Get variables
      run: |
        . <(cat variables)
        for v in "${!PADAVAN_@}"; do
          echo "$v=${!v}" >> $GITHUB_ENV
        done

    - name: Generate changelog from upstream
      run: |
        git clone --depth 200 -b "$PADAVAN_BRANCH" "$PADAVAN_REPO" upstream-log
        cd upstream-log
        CUR_COMMIT=$(git rev-parse HEAD)
        CUR_DATE=$(git log -1 --format='%ad' --date=short HEAD)
        PREV_COMMIT=$(cat ../.upstream/last-built 2>/dev/null || echo "")
        echo "CUR_COMMIT=$CUR_COMMIT" >> $GITHUB_ENV

        {
          echo "# Changelog — $(date '+%Y-%m-%d')"
          echo ""
          echo "Upstream: nilabsent/padavan-ng"
          echo "Коммит: ${CUR_COMMIT:0:10} (${CUR_DATE})"
          if [[ -n "$PREV_COMMIT" ]]; then
            PREV_DATE=$(git log -1 --format='%ad' --date=short "$PREV_COMMIT" 2>/dev/null || echo "-")
            echo "Предыдущий коммит: ${PREV_COMMIT:0:10} (${PREV_DATE})"
          else
            echo "Предыдущий коммит: отсутствует (первая сборка)"
          fi
          echo ""
        } > ../CHANGELOG.md

        if [[ -z "$PREV_COMMIT" ]]; then
          echo "### Первая сборка" >> ../CHANGELOG.md
          echo "Предыдущая версия отсутствует. Это первая сборка в данном форке." >> ../CHANGELOG.md
          echo "empty_first=true" >> $GITHUB_ENV
          exit 0
        fi

        if ! git cat-file -e "$PREV_COMMIT" 2>/dev/null; then
          echo "" >> ../CHANGELOG.md
          echo "### Предыдущий коммит недоступен" >> ../CHANGELOG.md
          echo "Коммит ${PREV_COMMIT:0:10} не найден в upstream-репозитории." >> ../CHANGELOG.md
          echo "empty_unknown=true" >> $GITHUB_ENV
          exit 0
        fi

        COMMITS=$(git log --oneline "$PREV_COMMIT..HEAD" 2>/dev/null)
        if [[ -z "$COMMITS" ]]; then
          echo "" >> ../CHANGELOG.md
          echo "Изменений нет: текущий коммит совпадает с предыдущим." >> ../CHANGELOG.md
          echo "empty_up_to_date=true" >> $GITHUB_ENV
          exit 0
        fi

        echo "### Добавлено" >> ../CHANGELOG.md
        git log --oneline "$PREV_COMMIT..HEAD" | grep -iE '(add(ing|ed| support)?|new)' | sed 's/^[0-9a-f]* //' | sed 's/^/- /' >> ../CHANGELOG.md || true
        echo "" >> ../CHANGELOG.md

        echo "### Исправлено" >> ../CHANGELOG.md
        git log --oneline "$PREV_COMMIT..HEAD" | grep -iE '(fix(ing|ed)?|bugfix|correct)' | sed 's/^[0-9a-f]* //' | sed 's/^/- /' >> ../CHANGELOG.md || true
        echo "" >> ../CHANGELOG.md

        echo "### Обновлено" >> ../CHANGELOG.md
        git log --oneline "$PREV_COMMIT..HEAD" | grep -iE '(updat(ing|ed)|bump|revert)' | sed 's/^[0-9a-f]* //' | sed 's/^/- /' >> ../CHANGELOG.md || true
        echo "" >> ../CHANGELOG.md

        echo "### Удалено" >> ../CHANGELOG.md
        git log --oneline "$PREV_COMMIT..HEAD" | grep -iE '(delet(ing|ed)|remove|removing|drop)' | sed 's/^[0-9a-f]* //' | sed 's/^/- /' >> ../CHANGELOG.md || true
        echo "" >> ../CHANGELOG.md

        echo "### Прочее" >> ../CHANGELOG.md
        git log --oneline "$PREV_COMMIT..HEAD" | grep -viE '(add(ing|ed| support)?|new|fix(ing|ed)?|bugfix|correct|updat(ing|ed)|bump|revert|delet(ing|ed)|remove|removing|drop)' | sed 's/^[0-9a-f]* //' | sed 's/^/- /' >> ../CHANGELOG.md || true
        echo "" >> ../CHANGELOG.md

        echo "PREV_COMMIT=$PREV_COMMIT" >> $GITHUB_ENV

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: firmware

    - name: Collect firmware files
      run: |
        mkdir -p release
        find firmware -type f \( -name '*.trx' -o -name '*.config' -o -name 'CHANGELOG-*.md' \) -exec cp {} release/ \;
        cp CHANGELOG.md release/
        ls -la release/

    - name: Commit .upstream state (last-built + clear pending)
      run: |
        # last-built и pending обновляем ОДНИМ коммитом.
        # Гонка с watch-upstream: он тоже пишет в .upstream/*, поэтому пуш
        # ретраим с rebase. Иначе либо мы, либо он получим non-fast-forward.
        git config user.name 'padavan-builder'
        git config user.email '<>'

        echo "$CUR_COMMIT" > .upstream/last-built
        : > .upstream/pending

        git add .upstream/last-built .upstream/pending
        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi

        git commit -q -m ".upstream: last-built -> ${CUR_COMMIT:0:10}, pending cleared

        Сборка ${RELEASE_TAG} включила все pending-коммиты, поэтому список очищен.
        last-built и pending держим согласованными в одном коммите."

        for i in 1 2 3 4 5; do
          if git push origin "HEAD:beta"; then
            echo "Pushed .upstream state to beta"
            exit 0
          fi
          echo "Push rejected (attempt $i), rebasing on origin/beta"
          git pull --rebase --autostash origin beta
        done

        echo "::error::Не удалось отправить .upstream state после 5 попыток"
        exit 1

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Padavan ${{ env.RELEASE_TAG }}
        target_commitish: beta
        body_path: CHANGELOG.md
        files: release/*
        make_latest: true